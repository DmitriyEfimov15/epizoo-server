# Прод-стенд: образ из registry, переменные — из .deploy.env, который собирает release-deploy.yml.
# Локальный запуск — compose.yaml.
name: epizoo-server

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-backend: &backend
  image: ${REGISTRY_URL:?}/${REGISTRY_REPO:?}:${VERSION:?}
  env_file: [.deploy.env]
  logging: *default-logging
  labels:
    env: prod
    project: epizoo
  volumes:
    - report-cache:/app/data/cache

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?}
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20

  # Миграции и справочники; запускается деплоем через `run --rm` до старта приложения.
  migrator:
    <<: *backend
    profiles: ['migration']
    command: python -m app.db.init
    restart: 'no'
    environment:
      - DATABASE_URL=${DATABASE_URL:?}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    # Наружу не публикуется: снаружи API доступен через nginx хоста (/api/, конфиг в репозитории клиента).
    ports:
      - '127.0.0.1:3021:8000'

  worker:
    <<: *backend
    restart: unless-stopped
    command: python -m worker.scheduler
    depends_on:
      db:
        condition: service_healthy

  # Включается деплоем, только если задан TELEGRAM_BOT_TOKEN.
  bot:
    <<: *backend
    profiles: ['telegram']
    restart: unless-stopped
    command: python -m bot.main
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  report-cache:
