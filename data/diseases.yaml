- slug: rabies
  name: Бешенство животных
  aliases:
  - Бешенство
  - Бешенство млекопитающих
  species:
  - cattle
  - small_ruminants
  - pigs
  - horses
  - rabbits
  - carnivores
  - wildlife
  is_zoonosis: true
  base_level: 5
  description: Вирусная инфекция млекопитающих, относящаяся к зоонозам.
  recommendations:
  - text: При подозрении на бешенство сообщите в течение 24 часов в региональный орган
      ветеринарии или подведомственную ему организацию (пункт 11).
    source_url: https://pravo.gov.ru/proxy/ips/?docbody=&nd=102951273
  - text: Предоставьте животных для осмотра по требованию специалистов государственной
      ветеринарной службы (пункт 7).
    source_url: https://pravo.gov.ru/proxy/ips/?docbody=&nd=102951273
  symptoms:
  - Изменение поведения, приступы агрессии
  - Слюнотечение и затруднённое глотание
  - Судороги, парезы или параличи
  symptoms_note: Признаки приведены справочно по пункту 3 ветеринарных правил. По
    ним нельзя самостоятельно подтвердить или исключить инфекцию; диагноз устанавливает
    ветеринарный специалист.
  symptom_source_urls:
  - https://pravo.gov.ru/proxy/ips/?docbody=&nd=102951273
  guidance_rule:
    number: '705'
    date: '2020-11-25'
    valid_from: '2021-03-01'
    valid_until: '2027-03-01'
  guidance_verified_at: '2026-10-14'
